name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare
        run: |
          pacman-key --init
          pacman -Syu --noconfirm
          # Everything we call dependency() on is listed explicitly. Dropping
          # sdl2 removed libxcursor, libxi, libxxf86vm and libxext along with
          # it, which we depend on directly and used to get transitively.
          pacman -S --noconfirm git meson clang glslang cmake \
            wlroots0.20 wayland wayland-protocols libdrm mesa pixman \
            vulkan-headers vulkan-icd-loader \
            libx11 libxcb libxmu libxcomposite libxrender libxres libxtst \
            libxdamage libxcursor libxi libxext libxfixes libxxf86vm \
            libxkbcommon libinput libcap libdecor luajit hwdata \
            libavif libheif aom rav1e \
            xorg-xwayland pipewire \
            benchmark catch2 gcovr
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build with gcc
        run: |
          export CC=gcc CXX=g++
          meson setup build-gcc/ -Dinput_emulation=disabled --werror --auto-features=enabled
          ninja -C build-gcc/
#      - name: Build with clang
#        run: |
#          export CC=clang CXX=clang++
#          meson setup build-clang/ -Dinput_emulation=disabled --werror --auto-features=enabled
#          ninja -C build-clang/
      - name: Run unit tests and collect coverage
        run: |
          export CC=gcc CXX=g++
          meson setup build-coverage -Dinput_emulation=disabled --werror --auto-features=enabled -Db_coverage=true
          meson compile -C build-coverage
          meson test -C build-coverage --suite gamescope -v
          gcovr -r src -e src/shaders --xml -o coverage.xml -s build-coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code coverage
          path: coverage.xml
